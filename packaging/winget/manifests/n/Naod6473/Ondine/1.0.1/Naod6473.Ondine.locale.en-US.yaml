ShortDescription: "A little island at the top of your Windows screen: music, clipboard, timer, calendar, notes, AI agents and IT tools, without switching windows."
Description: "Ondine lives at the top of your screen, like an iPhone's Dynamic Island. Move the mouse up: a pill appears, with Ondine, a little water drop that reacts to what happens. Click: the island opens onto your tools (music, clipboard, screenshots, timer, calendar, notes, AI agents, network tools…), without switching windows. Free, open source (MIT), no telemetry, in English and French."
