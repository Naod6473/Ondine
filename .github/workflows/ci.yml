# Vérifications automatiques : à chaque push sur main et à chaque PR,
# GitHub vérifie le code sur une machine Windows (comme celle de Simon).
# Rien n'est publié ici : on vérifie seulement que tout compile et que les
# tests passent.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Ces vérifications n'ont besoin que de lire le dépôt.
permissions:
  contents: read

jobs:
  verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branche « stable » au 2026-10-06)
        # Épinglée sur un commit : la version de Rust se donne ici (sinon
        # l'action la déduit du nom de la référence, qui n'en est plus un).
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances de l'interface
        run: npm ci

      - name: Vérifier l'interface (TypeScript + Vite)
        run: npm run build

      - name: Tests de l'interface (machine à états, réglages, traductions)
        run: npm test

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked

      # Aucun avertissement accepté : un nouvel avertissement de clippy fait
      # échouer la vérification (à corriger, ou à autoriser avec un commentaire).
      - name: Clippy (lint Rust)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  # Les dépendances ont-elles des failles connues ? (base RustSec pour Rust,
  # base GitHub pour npm). Sur Linux : plus rapide, et le résultat ne dépend
  # pas du système (on lit seulement Cargo.lock et package-lock.json).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dépendances npm de l'appli (hors outils de construction)
        run: npm audit --omit=dev --audit-level=high

      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # Les avis à ignorer (failles sans correctif, ou sans effet ici) sont
      # listés et expliqués dans src-tauri/.cargo/audit.toml.
      - name: Dépendances Rust (cargo audit)
        working-directory: src-tauri
        run: cargo audit
