# Publier le site vitrine (dossier site/) sur GitHub Pages.
#
# Se lance tout seul quand site/ change sur main, ou à la main depuis l'onglet Actions.
# Réglage à faire une fois sur GitHub : Settings → Pages → Source : « GitHub Actions »,
# puis Custom domain : ondine.pissits.com (et cocher « Enforce HTTPS »).
name: site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write # pour publier sur GitHub Pages
  id-token: write # pour prouver à Pages que la publication vient bien de ce dépôt

# Une seule publication à la fois ; on ne coupe pas celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Préparer le site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
