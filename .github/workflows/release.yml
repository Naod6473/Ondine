# Construire l'installateur Windows et préparer une version sur GitHub.
#
# Comment s'en servir :
#   1. mettre le même numéro dans package.json, src-tauri/tauri.conf.json et
#      src-tauri/Cargo.toml (ex. 1.0.0-beta.1) ;
#   2. lancer « release » à la main depuis l'onglet Actions (Run workflow) ;
#   3. GitHub construit l'installateur (*-setup.exe) et crée un BROUILLON de
#      version : rien n'est public tant que tu ne cliques pas « Publish ».
#      C'est « Publish » qui crée l'étiquette v1.0.0-… : le workflow ne se
#      déclenche donc PAS sur les étiquettes, sinon chaque publication
#      relançait une construction et créait un brouillon en double.
#
# Mises à jour automatiques : l'installateur est signé avec la clé privée des
# mises à jour (secrets TAURI_SIGNING_PRIVATE_KEY et
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD du dépôt), et un fichier latest.json est
# ajouté à la version. Ondine le lit sur « releases/latest » : une version
# marquée « pre-release » n'est donc jamais proposée en mise à jour.
name: release

on:
  workflow_dispatch:

jobs:
  installateur:
    runs-on: windows-latest
    permissions:
      contents: write # pour créer le brouillon de version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branche « stable » au 2026-10-06)
        # Épinglée sur un commit : la version de Rust se donne ici (sinon
        # l'action la déduit du nom de la référence, qui n'en est plus un).
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances de l'interface
        run: npm ci

      - name: Construire et préparer la version
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Fichiers de mise à jour (signature .sig) seulement ici : une
          # construction sur ton PC n'a pas besoin de la clé privée.
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: "Ondine v__VERSION__"
          releaseBody: "Télécharge le fichier *-setup.exe ci-dessous pour installer Ondine sur Windows 10 ou 11."
          releaseDraft: true
          # Pas « pre-release » : le bouton Télécharger du site et les mises à
          # jour pointent vers « latest », qui ignore les pre-releases.
          prerelease: false

      # L'installateur est aussi gardé comme artefact de cette exécution : le
      # workflow « installation » le reprend pour l'installer et le lancer sur
      # une machine Windows propre (voir .github/workflows/installation.yml).
      - name: Garder l'installateur pour le test d'installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installateur
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
