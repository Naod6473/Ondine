# Construire l'installateur Windows et préparer une version sur GitHub.
#
# Comment s'en servir :
#   1. mettre le même numéro dans package.json, src-tauri/tauri.conf.json et
#      src-tauri/Cargo.toml (ex. 1.0.0-beta.1) ;
#   2. lancer « release » à la main depuis l'onglet Actions (Run workflow) ;
#   3. GitHub construit l'installateur (*-setup.exe) et crée un BROUILLON de
#      version : rien n'est public tant que tu ne cliques pas « Publish ».
#      C'est « Publish » qui crée l'étiquette v1.0.0-… : le workflow ne se
#      déclenche donc PAS sur les étiquettes, sinon chaque publication
#      relançait une construction et créait un brouillon en double.
#
# Mises à jour automatiques : l'installateur est signé avec la clé privée des
# mises à jour (secrets TAURI_SIGNING_PRIVATE_KEY et
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD du dépôt), et un fichier latest.json est
# ajouté à la version. Ondine le lit sur « releases/latest » : une version
# marquée « pre-release » n'est donc jamais proposée en mise à jour.
name: release

on:
  workflow_dispatch:

jobs:
  installateur:
    runs-on: windows-latest
    permissions:
      contents: write # pour créer le brouillon de version
    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances de l'interface
        run: npm ci

      - name: Construire et préparer la version
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Fichiers de mise à jour (signature .sig) seulement ici : une
          # construction sur ton PC n'a pas besoin de la clé privée.
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: "Ondine v__VERSION__"
          releaseBody: "Télécharge le fichier *-setup.exe ci-dessous pour installer Ondine sur Windows 10 ou 11."
          releaseDraft: true
          # Pas « pre-release » : le bouton Télécharger du site et les mises à
          # jour pointent vers « latest », qui ignore les pre-releases.
          prerelease: false
