name: Un problème · Bug
description: Quelque chose ne marche pas comme prévu. · Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe · What happens
      description: Et ce que vous attendiez. Une capture ou une courte vidéo aide beaucoup. · And what you expected. A screenshot or short video helps a lot.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire · Steps to reproduce
      placeholder: |
        1. Ouvrir l'île
        2. …
  - type: input
    id: version
    attributes:
      label: Version d'Ondine · Ondine version
      description: Réglages → Mises à jour → Version installée · Settings → Updates → Installed version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2, écran à 125 %
  - type: textarea
    id: journal
    attributes:
      label: Journal · Log
      description: Les dernières lignes de %LOCALAPPDATA%\Ondine\logs\ondine.log (relisez-les avant d'envoyer). · The last lines of the log file (check them before posting).
      render: text
