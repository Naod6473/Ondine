[package]
name = "island"
version = "0.1.0"
description = "L'île : une interface intelligente en haut de l'écran Windows"
edition = "2021"
license = "MIT"

# lib + bin : c'est la forme que Tauri 2 attend (main.rs appelle island_lib::run()).
[lib]
name = "island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" : l'icône de la zone de notification.
tauri = { version = "2", features = ["tray-icon"] }
# Une seule île à la fois : relancer l'appli ouvre l'île existante.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Gestionnaire d'identifiants Windows. Version 3 volontairement : la 4 a changé d'API.
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# PAS de panic = "abort" : l'île rattrape les paniques d'un module
# (std::panic::catch_unwind), ce qui ne marche qu'avec le mode "unwind" par défaut.
