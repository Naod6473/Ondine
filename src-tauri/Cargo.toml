[package]
name = "ondine"
version = "1.2.2"
description = "L'île : une interface intelligente en haut de l'écran Windows"
edition = "2021"
license = "MIT"

# lib + bin : c'est la forme que Tauri 2 attend (main.rs appelle ondine_lib::run()).
[lib]
name = "ondine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" : l'icône de la zone de notification.
tauri = { version = "2", features = ["tray-icon"] }
# Une seule île à la fois : relancer l'appli ouvre l'île existante.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order : en réécrivant le settings.json d'un agent (hooks installés
# automatiquement), ses clés gardent leur ordre au lieu d'être triées.
serde_json = { version = "1", features = ["preserve_order"] }
# Boîte de dialogue « choisir un dossier » (plugin officiel de Tauri).
tauri-plugin-dialog = "2"
# Corbeille de Windows : envoyer et restaurer (jamais de suppression définitive).
trash = "5"
# Presse-papiers (texte) depuis le Rust.
# image-data : lire une image copiée (captures, phase 5).
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Enregistrer les captures en PNG, réduire une image trop grande pour l'OCR, et
# convertir / redimensionner les images glissées sur l'île (lecture PNG, JPEG, WebP, BMP, GIF).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# Dates des rendez-vous (.ics) : fuseaux UTC/local, jours de la semaine.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Création d'archives .zip (compression « deflate » seulement).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Le hasard du système (générateur de mots de passe) : pas un hasard « prévisible ».
getrandom = "0.3"
# Encode la pochette d'album en texte (data URL) pour l'afficher dans l'île.
base64 = "0.22"
# Surveillance de dossiers (règles de la phase 7). Version 8 : la 9 est encore en préversion.
notify = "8"
# Infos système (phase Outils IT) : processeur, mémoire, disques, réseau.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
# Raccourcis clavier globaux (plugin officiel de Tauri, version 2 : la 3 est en alpha).
tauri-plugin-global-shortcut = "2"
# Appeler l'API Claude (Demander à Claude). TLS de Windows (SChannel) et ses
# certificats racines (ceux d'une entreprise aussi) : pas de code C à compiler.
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }
# Mises à jour automatiques : lit latest.json sur GitHub, vérifie la signature
# de l'installateur (clé publique dans tauri.conf.json), puis le lance.
# TLS de Windows comme ureq (certificats d'entreprise compris).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
# QR code d'une copie (Presse-papiers), calculé sur le PC. Sans ses options
# d'image : seulement la grille, qu'on dessine nous-mêmes (aucune dépendance).
qrcode = { version = "0.14", default-features = false }
# Lire le config.toml de Codex (installer les hooks d'Ondine). Déjà compilé
# pour Tauri (tauri-utils) : aucun code en plus.
toml = "1"
# Empreinte d'un fichier glissé sur l'île (Étagère) : SHA-256 (déjà compilé
# pour Tauri), et MD5, SHA-1, SHA-512 pour comparer avec une empreinte copiée.
# Crates RustCrypto, sans code C.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# GIF animé (Capture → « Enregistrer un GIF ») : l'encodeur qu'utilise déjà la
# crate image (aucun code en plus), appelé directement pour n'écrire que la
# partie de l'image qui a changé d'une image à l'autre (fichier bien plus léger).
gif = "0.14"
# Module Équipe (Ondine ↔ Ondine sur le réseau local) : le chiffrement.
#   - snow : le protocole Noise (celui de WireGuard, WhatsApp, Lightning),
#     ici « IK » entre collègues appairés (authentifiés par leurs clés X25519,
#     secret de transfert) et « XXpsk3 » pendant l'appairage. Pur Rust,
#     primitives RustCrypto (X25519 de curve25519-dalek, ChaCha20-Poly1305,
#     BLAKE2s). On n'invente aucune cryptographie. Sans la fonction « std »
#     de snow : elle ajouterait la crate ring (du code C et assembleur).
#   - spake2 (RustCrypto) : transforme le code à 6 chiffres de l'appairage en
#     clé commune sans jamais l'envoyer ; un intrus n'a qu'UN essai par code
#     (pas d'attaque hors ligne possible, comme dans magic-wormhole).
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
spake2 = "0.4"
# La clé publique X25519 recalculée depuis la clé privée gardée (déjà compilée pour snow).
curve25519-dalek = "4"

[target.'cfg(windows)'.dependencies]
# Gestionnaire d'identifiants Windows. Version 3 volontairement : la 4 a changé d'API.
keyring = { version = "3", features = ["windows-native"] }
# Requis par la macro #[implement] (cible de dépôt) : même version que `windows`.
windows-core = "0.61"
windows = { version = "0.61", features = [
  # « En cours de lecture » (SMTC) : Media_Control, et Storage_Streams pour la pochette.
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  # Lire le texte d'une image (OCR de Windows, hors ligne) : phase 5.
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Win32_Foundation",
  # Cible de dépôt de l'île (platform/drop_target.rs).
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # Presse-papiers : numéro de copie, formats « sensibles ».
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_Security",
  # Droits du canal des agents (SDDL) et SID du compte (audit sécurité).
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Règles (phase 7) : lecteurs branchés (lettres, nom du volume), sans
  # fenêtre « pas de disque dans le lecteur ».
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  # Infos système : la batterie.
  "Win32_System_Power",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  # Contrôles : volume des haut-parleurs et du micro (Core Audio).
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # (requis par IMMDevice::Activate)
  "Win32_System_Variant",
  # Contrôles : le nom des sorties audio (IMMDevice::OpenPropertyStore).
  "Win32_UI_Shell_PropertiesSystem",
  # Contrôles : luminosité (WMI pour l'écran du portable, DDC/CI pour les externes).
  "Win32_System_Wmi",
  "Win32_Devices_Display",
  # Contrôles : qui utilise le micro / la caméra (registre « ConsentStore »).
  "Win32_System_Registry",
  # Langue de Windows (GetUserDefaultUILanguage) pour la langue « auto ».
  "Win32_Globalization",
  # Réseau : Internet joignable ? (NetworkListManager) et VPN branchés (cartes réseau).
  "Win32_Networking_NetworkListManager",
  "Win32_NetworkManagement_Ndis",
  # Contrôles : Wi-Fi, Bluetooth, mode avion.
  "Devices_Radios",
  "Foundation_Collections",
  # Capture : la pipette (pixels physiques sur chaque écran, fenêtre Win32).
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  # Profils : le nom du Wi-Fi connecté (wlanapi).
  "Win32_NetworkManagement_WiFi",
  # Étagère : glisser des fichiers vers l'Explorateur (PIDL, SHCreateDataObject).
  "Win32_UI_Shell_Common",
  # Contrôles : éjecter une clé USB (numéro du disque, arbre des périphériques,
  # CM_Request_Device_EjectW) et lire l'événement 225 qui nomme le programme qui bloque.
  "Win32_System_Ioctl",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_EventLog",
  # Parler à Ondine à voix haute : la reconnaissance vocale de Windows (platform/voice.rs).
  "Media_SpeechRecognition",
  # Règles : la session est-elle verrouillée (WTSQuerySessionInformationW) ?
  "Win32_System_RemoteDesktop",
  # Contrôles : batterie des appareils Bluetooth (SetupDiGetDevicePropertyW, DEVPROPTYPE).
  "Win32_Devices_Properties",
  # Ondine et les fenêtres : la vraie place des fenêtres (sans bordure
  # invisible), les fenêtres cachées par Windows, la session verrouillée.
  "Win32_Graphics_Dwm",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# PAS de panic = "abort" : l'île rattrape les paniques d'un module
# (std::panic::catch_unwind), ce qui ne marche qu'avec le mode "unwind" par défaut.
