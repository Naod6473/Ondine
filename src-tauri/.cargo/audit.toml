# Réglages de `cargo audit` (étape « audit » de .github/workflows/ci.yml).
#
# Une faille connue (« vulnerability ») fait échouer la CI. Les simples
# avertissements (« unmaintained », « unsound »…) sont affichés sans la faire
# échouer.
#
# Liste des avis ignorés : seulement ceux qui n'ont PAS de correctif, ou qui
# ne concernent pas Ondine. Chaque entrée dit pourquoi et depuis quand ; à
# revoir à chaque mise à jour de Tauri.
#
# Au 2026-10-06, `cargo audit` ne trouve aucune faille, seulement deux
# avertissements, laissés visibles (pas ignorés) :
#   - RUSTSEC-2024-0370 : proc-macro-error n'est plus maintenu (utilisé à la
#     compilation seulement, par une dépendance de Tauri sous Linux) ;
#   - RUSTSEC-2024-0429 : glib 0.18 (GTK, Linux seulement : absent de l'appli
#     Windows), corrigé dans glib 0.20 que Tauri n'utilise pas encore.

# Au 2026-10-17 : trois failles de zip 2.x (RUSTSEC-2026-0367, -0368, -0369 :
# extraction qui garde les bits SUID/SGID, liens symboliques, permissions
# Unix). Ondine passe à zip 9 ; il reste zip 2.4.2, tiré par sherpa-onnx-sys
# 1.13.8 (dernière version), en dépendance de CONSTRUCTION seulement : son
# build.rs ne s'en sert que pour les archives iOS (.xcframework.zip) ; sous
# Windows il lit un .tar.bz2. Jamais dans l'appli. À
# retirer dès qu'une version de sherpa-onnx passe à zip 9.

# Au 2026-10-28 : quatre failles de zstd (RUSTSEC-2026-0391, zstd 0.13.3 ;
# -0398 et -0403, zstd-safe 7.3.0 ; -0410, zstd-sys 2.1.1, allocateur
# WebAssembly). zstd n'arrive QUE par ce même zip 2.4.2 de sherpa-onnx-sys
# 1.13.8, en dépendance de construction : jamais dans l'appli (zip 9 d'Ondine
# n'a que « deflate »), et le build.rs ne décompresse que l'archive officielle
# de sherpa-onnx. sherpa-onnx 2.0.1 (sorti le 2026-10-27) passe à zip 9 et
# corrige tout, mais change le moteur de dictée : à faire dans sa propre MAJ,
# puis retirer ces quatre lignes ET les trois de zip ci-dessus.

[advisories]
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0410",
]
